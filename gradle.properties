# 强制统一使用 Android Studio 自带的 Java 17 环境，再也不会出现终端和界面割裂的情况
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.v.mvvm
pluginName_ = VLibraryPlugin
pluginVersion = 3.1.3
#表示插件适配的最低版本
pluginSinceBuild = 203
pluginVerifierIdeVersions = 2020.2.4, 2020.3.2, 2021.1

platformType = IC
platformVersion = 2020.2.4
platformDownloadSources = true
platformPlugins =java, com.intellij.java, org.jetbrains.android, android, org.jetbrains.kotlin

kotlin.stdlib.default.dependency = false
